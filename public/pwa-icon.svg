<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1b4931"/>
      <stop offset="60%" stop-color="#143826"/>
      <stop offset="100%" stop-color="#0a1f14"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6b3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6"/>

  <!-- Steaming Tea / Coffee Cup Silhouette -->
  <g filter="url(#shadow)" transform="translate(256, 215) scale(1.15)">
    <!-- Steam waves -->
    <path d="M-30,-75 C-25,-90 -35,-105 -30,-120" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M0,-80 C5,-98 -5,-115 0,-130" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M30,-75 C35,-90 25,-105 30,-120" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Cup Body -->
    <path d="M-60,-55 L60,-55 C56,-10 45,35 0,38 C-45,35 -56,-10 -60,-55 Z" fill="#FAF8F5"/>
    
    <!-- Cup Handle -->
    <path d="M58,-40 C78,-40 78,0 52,10" fill="none" stroke="#FAF8F5" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Saucer Plate -->
    <ellipse cx="0" cy="46" rx="72" ry="10" fill="url(#goldGrad)"/>

    <!-- Sacred Green Sprout / Leaf in Center -->
    <path d="M-15,-20 C-15,-45 15,-45 15,-20 C15,0 -15,0 -15,-20 Z" fill="url(#leafGrad)"/>
    <path d="M0,-35 L0,-10" stroke="#FAF8F5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <!-- DIVINE CAFE -->
  <text x="256" y="395" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="38" fill="#FFFFFF" letter-spacing="4">
    DIVINE CAFE
  </text>
  
  <!-- Tagline -->
  <text x="256" y="430" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#a3e635" letter-spacing="3">
    YOU ARE WHAT YOU EAT
  </text>

  <!-- Location Badge -->
  <text x="256" y="455" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#d4af37" letter-spacing="1.5">
    BARADARI GARDEN • PATIALA
  </text>
</svg>
